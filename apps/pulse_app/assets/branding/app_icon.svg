<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pulse">
  <!--
    Pulse app icon  Telemetry Peak
    Flat, two-color, Microsoft-utility style.
    Primary: #60CDFF on tile #1B1F24
  -->
  <rect width="32" height="32" rx="7" fill="#1B1F24"/>
  <!-- Precision baseline -->
  <path d="M5 22 H27" stroke="#60CDFF" stroke-width="2" stroke-linecap="round"/>
  <!-- Activity peak -->
  <path d="M5 22 L10.5 22 L14 8 L17.5 22 L27 22"
        fill="none"
        stroke="#60CDFF"
        stroke-width="2.25"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <!-- Sample node -->
  <circle cx="14" cy="8" r="2.1" fill="#60CDFF"/>
</svg>
