name: pulse
description: Pulse — Windows diagnostics
publish_to: "none"
version: 1.0.0+13

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  win32: ^5.10.0
  ffi: ^2.1.3
  pulse_protocol:
    path: ../../shared/pulse_protocol/dart
  lucide_icons_flutter: 3.1.15
  window_manager: ^0.5.2
  flutter_acrylic: ^1.1.4
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  archive: ^4.0.7
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.16.12

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# Microsoft Store identity (Partner Center — must match exactly).
# Store ID: 9PNDTLNTJ82T
# Package Family Name: Regncreative.PulseDiagnostics_epm7gp6hnh3h0
msix_config:
  display_name: Pulse Diagnostics
  publisher_display_name: Regncreative
  identity_name: Regncreative.PulseDiagnostics
  publisher: CN=72B69D57-C9E8-4280-AF56-B142286B0D20
  msix_version: 1.0.0.0
  logo_path: assets/branding/app_icon_512.png
  trim_logo: false
  languages: en-us
  # Packaged services require Windows 10 version 2004 (10.0.19041.0)+.
  os_min_version: 10.0.19041.0
  architecture: x64
  store: true
  sign_msix: false
  install_certificate: false
  output_path: ../../dist/msix
  output_name: PulseDiagnostics-1.0.0-Store
  # Desktop bridge client + LocalService packaged PulseService (desktop6:Service).
  # Partner Center must approve the packagedServices restricted capability.
  capabilities: runFullTrust, internetClient, packagedServices
