name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  service:
    # windows-latest is Windows Server 2025 + Visual Studio 2026 (vswhere path
    # Microsoft Visual Studio\18\...). Visual Studio 17 2022 is no longer installed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Configure
        run: cmake -S service/pulse_service -B build/service -G "Visual Studio 18 2026" -A x64
      - name: Build
        run: cmake --build build/service --config Release
      - name: Test (ctest)
        run: ctest --test-dir build/service -C Release --output-on-failure

  flutter:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Pub get
        working-directory: apps/pulse_app
        run: flutter pub get
      - name: Analyze
        working-directory: apps/pulse_app
        run: flutter analyze
      - name: Test
        working-directory: apps/pulse_app
        run: flutter test

  pulse_mcp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/pulse_mcp/package-lock.json
      - name: Install
        working-directory: apps/pulse_mcp
        run: npm ci
      - name: Build
        working-directory: apps/pulse_mcp
        run: npm run build
      - name: Test
        working-directory: apps/pulse_mcp
        run: npm test
